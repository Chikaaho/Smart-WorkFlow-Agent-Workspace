name: Build & Release (main)

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint, test and build
        run: NODE_OPTIONS="--max-old-space-size=2048" sh -c 'pnpm typecheck && pnpm lint && pnpm test && pnpm build'

      - name: Package dist artifacts
        id: package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          zip -r "dist-${GITHUB_SHA}.zip" dist
          echo "sha_full=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="build-${GITHUB_SHA}"
          # 固定发布目标：tag 与本次构建提交（完整 SHA）绑定，main 后续推进不改变目标。
          # 已有同名 tag 时核对目标提交：非构建提交则拒绝发布，绝不覆盖其他提交的发行物。
          EXISTING_TAG_TARGET=$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}' || true)
          if [ -n "${EXISTING_TAG_TARGET}" ] && [ "${EXISTING_TAG_TARGET}" != "${GITHUB_SHA}" ]; then
            echo "::error::tag ${TAG} 已指向其他提交 ${EXISTING_TAG_TARGET}，拒绝覆盖其他提交的发行物"
            exit 1
          fi
          # 同提交重跑：仅删除既有 Release（保留 tag），随后重建；不删除其他 tag/Release。
          gh release view "${TAG}" >/dev/null 2>&1 && gh release delete "${TAG}" --yes || true
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "CH-aPaaS-Web ${{ steps.package.outputs.version }} build ${GITHUB_SHA}" \
            --notes "自动构建产物（提交 ${GITHUB_SHA}，分支 main）" \
            "dist-${GITHUB_SHA}.zip"