name: Build & Release (main)

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: MAVEN_OPTS="-Xmx2g" mvn -B -ntp install

      - name: Locate executable JAR
        id: locate
        run: |
          JAR=$(ls sw-bootstrap/target/*.jar | grep -v '\.original$' | head -1)
          VERSION=$(grep -m1 -oE '<version>[^<]+</version>' pom.xml | sed 's/<[^>]*>//g')
          echo "jar=${JAR}" >> "$GITHUB_OUTPUT"
          echo "jar_name=$(basename "${JAR}")" >> "$GITHUB_OUTPUT"
          echo "sha_short=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="build-${GITHUB_SHA}"
          # 固定发布目标：tag 与本次构建提交（完整 SHA）绑定，main 后续推进不改变目标。
          # 已有同名 tag 时核对目标提交：非构建提交则拒绝发布，绝不覆盖其他提交的发行物。
          EXISTING_TAG_TARGET=$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}' || true)
          if [ -n "${EXISTING_TAG_TARGET}" ] && [ "${EXISTING_TAG_TARGET}" != "${GITHUB_SHA}" ]; then
            echo "::error::tag ${TAG} 已指向其他提交 ${EXISTING_TAG_TARGET}，拒绝覆盖其他提交的发行物"
            exit 1
          fi
          # 同提交重跑：仅删除既有 Release（保留 tag），随后重建；不删除其他 tag/Release。
          gh release view "${TAG}" >/dev/null 2>&1 && gh release delete "${TAG}" --yes || true
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "CH-aPaaS-Server ${{ steps.locate.outputs.version }} build ${GITHUB_SHA}" \
            --notes "自动构建产物（提交 ${GITHUB_SHA}，分支 main）" \
            "${{ steps.locate.outputs.jar }}#${{ steps.locate.outputs.jar_name }}"